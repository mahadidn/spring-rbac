spring.application.name=mdn

spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://localhost:5433/portal
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Database KEDUA: inventory_db =====
app.datasource.inventory.jdbc-url=jdbc:postgresql://localhost:5433/inventory_db
app.datasource.inventory.username=postgres
app.datasource.inventory.password=postgres
app.datasource.driver-class-name=postgres

# Tampilkan SQL yang dijalankan jOOQ di console (bagus untuk belajar)
logging.level.org.jooq.tools.LoggerListener=DEBUG

spring.config.activate.on-profile=dev

# Scalar/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.packages-to-scan=com.test.mdn
springdoc.paths-to-match=/api/**
scalar.enabled=true
scalar.path=/docs
scalar.url=/api-docs

scalar.theme-mode=dark
scalar.theme=mars
scalar.layout=modern
scalar.documentDownloadType=both
scalar.persist-auth=true


spring.jpa.show-sql=true